<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{border-radius:14px;height:90px;display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:700;border:1px solid #eee}
</style></head><body>
<div class="grid">
  <div class="sw" style="background:var(--ink-900);color:#fff">Ink 900 #1B1B2F</div>
  <div class="sw" style="background:var(--cream-50);color:var(--ink-900)">Cream 50 #FFF8EC</div>
  <div class="sw" style="background:#fff;color:var(--ink-900)">White #FFFFFF</div>
</div>
</body></html>
