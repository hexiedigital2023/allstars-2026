<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;font-family:var(--font-body);background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:14px;height:90px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px;font-weight:700}
</style></head><body>
<div class="grid">
  <div class="sw" style="background:var(--red-500)">Red 500 #EF3340</div>
  <div class="sw" style="background:var(--yellow-500);color:#5A3D00">Yellow 500 #F5B300</div>
  <div class="sw" style="background:var(--blue-500)">Blue 500 #1E88E5</div>
  <div class="sw" style="background:var(--green-500)">Green 500 #3CB878</div>
</div>
</body></html>
