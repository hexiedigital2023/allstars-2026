<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;font-family:var(--font-body)}

.phone{font-family:var(--font-display);font-weight:600;text-decoration:none;color:var(--color-text)}
</style></head><body>
<header>

  <nav><a class="active" href="#">Home</a><a href="#">Attractions</a><a href="#">Pricing &amp; Hours</a><a href="#">Parties</a><a href="#">FAQ</a></nav>

</body></html>
