<!-- @dsCard group="Components" viewport="700x360" name="Core: Button, Badge, Card" subtitle="Pill buttons, tag pills, content cards" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css"><style>
body{margin:0;padding:24px;background:var(--white);font-family:var(--font-body)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;padding:14px 28px;border-radius:var(--radius-pill);font-family:var(--font-display);font-weight:600;font-size:var(--text-base);text-decoration:none;border:2px solid transparent}
.primary{background:var(--color-primary);color:#fff;box-shadow:var(--shadow-lift)}
.accent{background:var(--color-accent);color:var(--color-text)}
.outline{background:transparent;color:var(--color-text);border-color:var(--ink-900)}
.dark{background:var(--color-bg-dark);color:#fff}
.badge{display:inline-flex;padding:6px 16px;border-radius:var(--radius-pill);font-weight:700;font-size:var(--text-xs)}
.b-red{background:rgba(239,51,64,.12);color:var(--red-600)}
.b-yellow{background:rgba(255,201,60,.25);color:#8A6300}
.b-blue{background:rgba(30,136,229,.12);color:var(--blue-600)}
.b-green{background:rgba(60,184,120,.15);color:var(--green-600)}
.card{border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-card);width:220px}
.cream{background:var(--color-bg-alt)}
h3{font-family:var(--font-display);margin:0 0 8px;font-size:var(--text-lg)}
p{margin:0;font-size:var(--text-sm);color:var(--color-text-muted)}
</style></head><body>
<div class="row">
  <a class="btn primary" href="#">Book a party</a>
  <a class="btn accent" href="#">See pricing</a>
  <a class="btn outline" href="#">Plan a visit</a>
  <a class="btn dark" href="#">Call us</a>
</div>
<div class="row">
  <span class="badge b-red">Ages 1-3</span>
  <span class="badge b-yellow">115' Zipline</span>
  <span class="badge b-blue">Toddler area</span>
  <span class="badge b-green">Open today</span>
</div>
<div class="row">
  <div class="card cream"><h3>115' zipline</h3><p>Edmonton's longest indoor zipline.</p></div>
  <div class="card"><h3>Star's Café</h3><p>Fresh, locally-sourced, nut-free menu.</p></div>
</div>
</body></html>
